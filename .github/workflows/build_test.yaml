name: build-test

on:
  push:
    branches:
      - master
    paths-ignore:
      - ".vscode/**"
      - "CHANGELOG.md"
      - "LICENSE"
      - "README.md"
      - "resources/**"
      - "**/CHANGELOG.md"
      - "**/LICENSE"
      - "**/README.md"
  pull_request:
    paths-ignore:
      - ".vscode/**"
      - "CHANGELOG.md"
      - "LICENSE"
      - "README.md"
      - "resources/**"
      - "**/CHANGELOG.md"
      - "**/LICENSE"
      - "**/README.md"
  workflow_dispatch:

concurrency:
  group: >
    ${{ github.workflow }}
    ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # Important
      matrix:
        runner: [ubuntu, windows, macos]
        include:
          - runner: ubuntu
            target: linux
          - runner: windows
            target: windows
          - runner: macos
            target: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Ninja and GTK3 toolchain (Only Linux)
        if: matrix.runner == 'ubuntu'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Fetch dependencies
        working-directory: window_controls/example
        run: flutter pub get

      - name: Run flutter build ${{ matrix.target }}
        working-directory: window_controls/example
        run: flutter build ${{ matrix.target }} --release -v

      - name: Archive artifacts (Linux)
        if: matrix.runner == 'ubuntu'
        uses: actions/upload-artifact@v4
        with:
          name: window_controls_example_${{ matrix.runner }}
          path: window_controls/example/build/linux/x64/release/bundle/

      - name: Archive artifacts (Windows)
        if: matrix.runner == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: window_controls_example_${{ matrix.runner }}
          path: window_controls/example/build/windows/runner/Release/window_controls_example.exe

      - name: Archive artifacts (macOS)
        if: matrix.runner == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: window_controls_example_${{ matrix.runner }}
          path: window_controls/example/build/macos/Build/Products/Release/window_controls_example.app

  publish-dry-run:
    name: publish dry-run (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - window_controls_platform_interface
          - window_controls_windows
          - window_controls_macos
          - window_controls_linux
          - window_controls
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Publish dry-run
        working-directory: ${{ matrix.package }}
        run: flutter pub publish --dry-run
