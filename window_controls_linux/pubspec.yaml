name: window_controls_linux
description: Linux implementation of the window_controls plugin, which provides custom window frames, title bars and window controls for Flutter desktop.
version: 0.1.1
repository: https://github.com/Ali-Fadaei/Window-Controls-Flpk
issue_tracker: https://github.com/Ali-Fadaei/Window-Controls-Flpk/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  window_controls_platform_interface: ^0.1.0
  ffi: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: window_controls
    platforms:
      linux:
        pluginClass: WindowControlsPlugin
