name: window_controls_windows
description: Windows implementation of the window_controls plugin, which provides custom window frames, title bars and window controls for Flutter desktop.
version: 0.1.0
repository: https://github.com/Ali-Fadaei/Window-Controls-Flpk
issue_tracker: https://github.com/Ali-Fadaei/Window-Controls-Flpk/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  window_controls_platform_interface: ^0.1.0
  win32: ^6.3.0
  ffi: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: window_controls
    platforms:
      windows:
        pluginClass: WindowControlsPlugin
